<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HousAlert – Latest Rentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ha-text:        #0f172a;
    --ha-card-bg:     #f3eefc;
    --ha-card-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
    --ha-radius:      14px;
    --ha-img-h:       178px;
    --ha-icon:        #7c3aed;
    --ha-gap:         14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow-x: hidden; }

  #ha-widget {
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--ha-text);
    background: transparent;
    padding: 0 0 24px;
    width: 100%;
  }

  /* ── Headline (ONE inline sentence) ──────────────────── */

  .ha-headline {
    text-align: center;
    text-transform: uppercase;
    font-size: clamp(25px, 5.2vw, 70px);
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: .04em;
    color: var(--ha-text);
    margin-bottom: 36px;
    padding: 0 28px;
  }

  @media (min-width: 900px) {
    .ha-headline {
      font-size: clamp(34px, 3.4vw, 52px);
      line-height: 1.14;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }
  }

  /* City dropdown — must match heading font exactly */
  .ha-city-wrap {
    display: inline-block;
    position: relative;
    vertical-align: baseline;
  }

  .ha-city-wrap select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid var(--ha-text);
    border-radius: 0;
    padding: 0 .9em 2px 0;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    line-height: inherit;
    color: var(--ha-text);
    cursor: pointer;
    outline: none;
  }

  .ha-city-wrap::after {
    content: "";
    position: absolute;
    right: .1em;
    top: 50%;
    transform: translateY(-52%);
    width: 0; height: 0;
    border-left: .3em solid transparent;
    border-right: .3em solid transparent;
    border-top: .38em solid var(--ha-text);
    pointer-events: none;
  }

  /* ── Carousel wrapper ─────────────────────────────────── */

  .ha-carousel-wrap {
    position: relative;
    margin: 0 24px;
  }

  .ha-nav-btn {
    position: absolute;
    top: calc(var(--ha-img-h) / 2);
    transform: translateY(-50%);
    z-index: 10;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #e2e4ea;
    box-shadow: 0 2px 8px rgba(0,0,0,.13);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
    padding: 0;
    transition: box-shadow .15s;
  }
  .ha-nav-btn:hover    { box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .ha-nav-btn:disabled { opacity: .28; cursor: default; box-shadow: none; }

  .ha-nav-prev { left: -24px; }
  .ha-nav-next { right: -24px; }

  /* ── Cards strip ──────────────────────────────────────── */

  .ha-cards {
    display: flex;
    gap: var(--ha-gap);
    overflow-x: auto;
    padding-bottom: 20px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .ha-cards::-webkit-scrollbar { display: none; }

  /* ── Dots ─────────────────────────────────────────────── */

  .ha-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    min-height: 16px;
  }

  .ha-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: none;
    background: #c4b5fd;
    cursor: pointer;
    padding: 0;
    transition: background .2s;
  }
  .ha-dot.active { background: var(--ha-text); }

  /* ── Card ─────────────────────────────────────────────── */

  .ha-card {
    flex: 0 0 calc(20% - 12px);
    scroll-snap-align: start;
    background: var(--ha-card-bg);
    border-radius: var(--ha-radius);
    overflow: hidden;
    box-shadow: var(--ha-card-shadow);
    display: flex;
    flex-direction: column;
    cursor: default;
    user-select: none;
  }

  .ha-img-wrap {
    width: 100%;
    height: var(--ha-img-h);
    overflow: hidden;
    background: #ddd0f8;
    position: relative;
    flex-shrink: 0;
    border-radius: var(--ha-radius) var(--ha-radius) 0 0;
  }

  .ha-img-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }

  .ha-img-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .3;
  }

  /* Card body — compact */
  .ha-card-body {
    padding: 9px 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1;
  }

  .ha-card-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--ha-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 9px;
  }

  /* Pills */
  .ha-pills {
    display: flex;
    flex-wrap: nowrap;
    gap: 5px;
    overflow: hidden;
    align-items: center;
  }

  .ha-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--ha-text);
    background: #fff;
    white-space: nowrap;
    flex-shrink: 0;
    color: var(--ha-text);
    line-height: 1.4;
  }

  .ha-pill-icon svg { color: var(--ha-icon); flex-shrink: 0; }
  .ha-pill-price    { font-weight: 800; }

  /* ── Skeleton ─────────────────────────────────────────── */

  .ha-sk {
    flex: 0 0 calc(20% - 12px);
    border-radius: var(--ha-radius);
    overflow: hidden;
    background: var(--ha-card-bg);
    box-shadow: var(--ha-card-shadow);
  }

  .ha-sk-img {
    width: 100%;
    height: var(--ha-img-h);
    background: linear-gradient(90deg, #e9e0ff 25%, #d8caff 50%, #e9e0ff 75%);
    background-size: 200% 100%;
    animation: ha-shimmer 1.5s ease-in-out infinite;
  }

  .ha-sk-body { padding: 9px 11px; display: flex; flex-direction: column; gap: 7px; }

  .ha-sk-line {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, #e9e0ff 25%, #d8caff 50%, #e9e0ff 75%);
    background-size: 200% 100%;
    animation: ha-shimmer 1.5s ease-in-out infinite;
  }

  @keyframes ha-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .ha-empty {
    padding: 40px 0;
    text-align: center;
    color: #64748b;
    font-size: 13px;
    width: 100%;
  }

  /* ── Tablet: 3 cards ──────────────────────────────────── */
  @media (min-width: 541px) and (max-width: 860px) {
    .ha-card, .ha-sk { flex: 0 0 calc(33.333% - 10px); }
  }

  /* ── Mobile ───────────────────────────────────────────── */
  @media (max-width: 540px) {
    :root { --ha-img-h: 190px; }

    .ha-carousel-wrap { margin: 0 16px; }
    .ha-nav-prev { left: -20px; }
    .ha-nav-next { right: -20px; }

    .ha-cards {
      padding-left: 5vw;
      padding-right: 5vw;
      scroll-padding-inline: 5vw;
    }

    .ha-card, .ha-sk {
      flex: 0 0 82vw;
      scroll-snap-align: center;
    }
  }
</style>
</head>
<body>
<div id="ha-widget">

  <div class="ha-headline">
    RENTAL PROPERTIES RECENTLY FOUND BY HOUSALERT IN&nbsp;<span class="ha-city-wrap">
      <span id="ha-city-mirror" aria-hidden="true" style="position:fixed;left:-9999px;top:0;visibility:hidden;white-space:pre;pointer-events:none;"></span>
      <select id="ha-city-select" aria-label="Select city">
        <option value="Dublin">Dublin</option>
        <option value="Cork">Cork</option>
        <option value="Galway">Galway</option>
        <option value="Limerick">Limerick</option>
        <option value="Waterford">Waterford</option>
        <option value="Drogheda">Drogheda</option>
        <option value="Dundalk">Dundalk</option>
        <option value="Swords">Swords</option>
        <option value="Bray">Bray</option>
        <option value="Kilkenny">Kilkenny</option>
      </select>
    </span>
  </div>

  <div class="ha-carousel-wrap">
    <button class="ha-nav-btn ha-nav-prev" id="ha-prev" aria-label="Previous">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="ha-cards" id="ha-cards"></div>
    <button class="ha-nav-btn ha-nav-next" id="ha-next" aria-label="Next">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="ha-dots" id="ha-dots"></div>

</div>

<script>
(function () {
  var widgetEl  = document.getElementById("ha-widget");
  var API_BASE  = (widgetEl && widgetEl.getAttribute("data-api"))
    || (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? window.location.origin : "https://app.housalert.com");

  var citySelect = document.getElementById("ha-city-select");
  var cityMirror = document.getElementById("ha-city-mirror");
  var cardsEl    = document.getElementById("ha-cards");
  var dotsEl     = document.getElementById("ha-dots");
  var prevBtn    = document.getElementById("ha-prev");
  var nextBtn    = document.getElementById("ha-next");

  /* Size the city <select> to match the current option's text width exactly.
     Uses canvas.measureText (synchronous, font-aware, no layout dependency). */
  var _measureCanvas = null;
  function measureText(text, cs) {
    if (!_measureCanvas) _measureCanvas = document.createElement("canvas");
    var ctx = _measureCanvas.getContext("2d");
    ctx.font = (cs.fontStyle || "normal") + " " + (cs.fontWeight || "600") + " "
             + cs.fontSize + " " + (cs.fontFamily || "Montserrat,sans-serif");
    return ctx.measureText(text).width;
  }

  function resizeCitySelect() {
    var opt = citySelect.options[citySelect.selectedIndex];
    if (!opt) return;
    var cs  = window.getComputedStyle(citySelect);
    var fsPx = parseFloat(cs.fontSize);
    if (!fsPx) return;
    var text = opt.text.toUpperCase();
    var w;
    try {
      w = measureText(text, cs);
    } catch (e) {
      /* fallback: rough estimate (Montserrat uppercase ≈ 0.65× em per char) */
      w = text.length * fsPx * 0.65;
    }
    /* canvas.measureText ignores letter-spacing — add it manually */
    var ls = parseFloat(cs.letterSpacing) || 0;
    w += ls * text.length;
    if (w > 0) {
      /* +36px for right padding + caret arrow + safety margin */
      citySelect.style.width = Math.ceil(w + 36) + "px";
    }
  }

  /* Run on load, after font swap, and on resize */
  setTimeout(resizeCitySelect, 0);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      resizeCitySelect();
      setTimeout(resizeCitySelect, 100);
    });
  }
  window.addEventListener("resize", resizeCitySelect);

  var BED_ICON  = '<span class="ha-pill-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg></span>';
  var SIZE_ICON = '<span class="ha-pill-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></span>';
  var HOUSE_SVG = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9f7aea" stroke-width="1.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';

  var totalCards = 0;
  var cardW = 0;

  /* Server already normalises the title via getIrishDisplayTitle().
     Just pass it through; only strip a trailing dot for safety. */
  function shortTitle(displayTitle, city) {
    if (!displayTitle) return city || "Rental Property";
    return displayTitle.replace(/\.$/, "").trim() || city || "Rental Property";
  }

  function getVisible() {
    return window.innerWidth <= 540 ? 1 : window.innerWidth <= 860 ? 3 : 5;
  }

  function scrollStep() { return cardW + 14; }

  function updateNav() {
    var sl    = cardsEl.scrollLeft;
    var maxSl = cardsEl.scrollWidth - cardsEl.clientWidth;
    prevBtn.disabled = sl <= 2;
    nextBtn.disabled = sl >= maxSl - 2;
  }

  function buildDots() {
    var visible = getVisible();
    if (totalCards <= visible) { dotsEl.innerHTML = ""; return; }
    var steps  = totalCards - visible + 1;
    var sl     = cardsEl.scrollLeft;
    var step   = scrollStep() || 1;
    var active = Math.min(Math.round(sl / step), steps - 1);
    var html   = "";
    for (var i = 0; i < steps; i++) {
      html += "<button class='ha-dot" + (i === active ? " active" : "") + "' data-i='" + i + "'></button>";
    }
    dotsEl.innerHTML = html;
    dotsEl.querySelectorAll(".ha-dot").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(this.getAttribute("data-i"), 10);
        cardsEl.scrollTo({ left: idx * scrollStep(), behavior: "smooth" });
      });
    });
  }

  function onScroll() { updateNav(); buildDots(); }

  cardsEl.addEventListener("scroll", onScroll, { passive: true });
  prevBtn.addEventListener("click", function () { cardsEl.scrollBy({ left: -scrollStep(), behavior: "smooth" }); });
  nextBtn.addEventListener("click", function () { cardsEl.scrollBy({ left:  scrollStep(), behavior: "smooth" }); });
  window.addEventListener("resize", function () {
    var c = cardsEl.querySelector(".ha-card");
    cardW = c ? c.offsetWidth : cardW;
    buildDots();
    updateNav();
  });

  function timeAgo(iso) {
    var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60)    return "just now";
    if (diff < 3600)  return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function skeletons(n) {
    var s = "";
    for (var i = 0; i < n; i++) {
      s += '<div class="ha-sk"><div class="ha-sk-img"></div>'
        + '<div class="ha-sk-body">'
        + '<div class="ha-sk-line" style="width:64%"></div>'
        + '<div class="ha-sk-line" style="width:34%"></div>'
        + '<div class="ha-sk-line" style="width:80%"></div>'
        + '</div></div>';
    }
    return s;
  }

  function renderCards(listings) {
    if (!listings || !listings.length) {
      dotsEl.innerHTML = "";
      return '<div class="ha-empty">No preview listings available in this city yet.</div>';
    }
    var items = listings.slice(0, 8);
    totalCards = items.length;

    return items.map(function (l) {
      var title    = shortTitle(l.displayTitle, l.city);
      var imgStyle = l.imageUrl ? "background-image:url(" + l.imageUrl + ")" : "";

      /* Defensive field mapping — cover any API shape */
      var beds = l.bedrooms || l.beds || l.bedroom_count || l.bed_count || 0;
      var size = l.size_m2  || l.size || l.area || l.area_m2 || 0;
      var price = l.price   || l.rent || l.price_eur || 0;

      var pills = "";
      if (beds > 0) {
        pills += "<span class='ha-pill'>" + BED_ICON + esc(beds) + "</span>";
      }
      if (size > 0) {
        pills += "<span class='ha-pill'>" + SIZE_ICON + esc(Math.round(size)) + " m\u00b2</span>";
      }
      if (price > 0) {
        pills += "<span class='ha-pill ha-pill-price'>\u20ac" + Number(price).toLocaleString("en-IE") + "</span>";
        /* price pill intentionally has no icon — bold number only */
      }

      return "<div class='ha-card'>"
        + "<div class='ha-img-wrap'>"
        + (imgStyle ? "<div class='ha-img-bg' style='" + imgStyle + "'></div>" : "")
        + "<div class='ha-img-placeholder'>" + HOUSE_SVG + "</div>"
        + "</div>"
        + "<div class='ha-card-body'>"
        + "<div class='ha-card-title'>" + esc(title) + "</div>"
        + (pills ? "<div class='ha-pills'>" + pills + "</div>" : "")
        + "</div></div>";
    }).join("");
  }

  function load(city) {
    cardsEl.innerHTML = skeletons(5);
    dotsEl.innerHTML  = "";
    prevBtn.disabled  = true;
    nextBtn.disabled  = false;

    fetch(API_BASE + "/api/public/latest-listings?city=" + encodeURIComponent(city) + "&limit=8")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        cardsEl.innerHTML = renderCards(data.listings);
        cardsEl.scrollLeft = 0;
        requestAnimationFrame(function () {
          var c = cardsEl.querySelector(".ha-card");
          cardW = c ? c.offsetWidth : 200;
          buildDots();
          updateNav();
          resizeCitySelect();
        });
      })
      .catch(function () {
        cardsEl.innerHTML = '<div class="ha-empty">Unable to load listings right now.</div>';
        dotsEl.innerHTML  = "";
      });
  }

  citySelect.addEventListener("change", function () {
    resizeCitySelect();
    load(this.value);
  });

  load("Dublin");
})();
</script>
</body>
</html>
