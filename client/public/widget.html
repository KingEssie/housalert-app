<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HousAlert – Latest Rentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ha-text:        #0f172a;
    --ha-muted:       #64748b;
    --ha-card-bg:     #f3eefc;
    --ha-card-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
    --ha-radius:      14px;
    --ha-img-h:       190px;
    --ha-icon:        #7c3aed;
    --ha-gap:         14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow-x: hidden; }

  #ha-widget {
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--ha-text);
    background: transparent;
    padding: 0 0 8px;
    width: 100%;
  }

  /* ── Headline ─────────────────────────────────────────── */

  .ha-headline {
    text-align: center;
    text-transform: uppercase;
    color: var(--ha-text);
    margin-bottom: 36px;
    letter-spacing: .05em;
  }

  .ha-hl1 {
    font-size: clamp(22px, 4.8vw, 62px);
    font-weight: 600;
    line-height: 1.15;
    display: block;
  }

  .ha-hl2 {
    font-size: clamp(20px, 4.3vw, 56px);
    font-weight: 600;
    line-height: 1.2;
    display: block;
    margin-top: .15em;
  }

  /* Count stays same dark color */
  .ha-num { color: var(--ha-text); }

  /* City dropdown — inherits heading exactly */
  .ha-city-wrap {
    display: inline-block;
    position: relative;
    vertical-align: baseline;
    margin-left: .18em;
  }

  .ha-city-wrap select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid var(--ha-text);
    border-radius: 0;
    padding: 0 .9em 2px 0;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    line-height: inherit;
    color: var(--ha-text);
    cursor: pointer;
    outline: none;
  }

  .ha-city-wrap::after {
    content: "";
    position: absolute;
    right: .1em;
    top: 50%;
    transform: translateY(-52%);
    width: 0; height: 0;
    border-left: .3em solid transparent;
    border-right: .3em solid transparent;
    border-top: .38em solid var(--ha-text);
    pointer-events: none;
  }

  /* ── Carousel wrapper ─────────────────────────────────── */

  .ha-carousel-wrap {
    position: relative;
    margin: 0 24px;
  }

  .ha-nav-btn {
    position: absolute;
    top: calc(var(--ha-img-h) / 2);
    transform: translateY(-50%);
    z-index: 10;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #e2e4ea;
    box-shadow: 0 2px 8px rgba(0,0,0,.13);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
    padding: 0;
    transition: box-shadow .15s;
  }
  .ha-nav-btn:hover  { box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .ha-nav-btn:disabled { opacity: .28; cursor: default; box-shadow: none; }

  .ha-nav-prev { left: -24px; }
  .ha-nav-next { right: -24px; }

  /* ── Cards strip ──────────────────────────────────────── */

  .ha-cards {
    display: flex;
    gap: var(--ha-gap);
    overflow-x: auto;
    padding-bottom: 6px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .ha-cards::-webkit-scrollbar { display: none; }

  /* ── Dots ─────────────────────────────────────────────── */

  .ha-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    min-height: 16px;
  }

  .ha-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: none;
    background: #c4b5fd;
    cursor: pointer;
    padding: 0;
    transition: background .2s;
  }
  .ha-dot.active { background: var(--ha-text); }

  /* ── Card ─────────────────────────────────────────────── */

  .ha-card {
    flex: 0 0 calc(20% - 12px);
    scroll-snap-align: start;
    background: var(--ha-card-bg);
    border-radius: var(--ha-radius);
    overflow: hidden;
    box-shadow: var(--ha-card-shadow);
    display: flex;
    flex-direction: column;
    cursor: default;
    user-select: none;
  }

  /* Image — rounded top corners only */
  .ha-img-wrap {
    width: 100%;
    height: var(--ha-img-h);
    overflow: hidden;
    background: #ddd0f8;
    position: relative;
    flex-shrink: 0;
    border-radius: var(--ha-radius) var(--ha-radius) 0 0;
  }

  .ha-img-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }

  .ha-img-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .3;
  }

  /* Card body */
  .ha-card-body {
    padding: 10px 12px 13px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .ha-card-title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.28;
    color: var(--ha-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ha-card-meta {
    font-size: 11px;
    color: var(--ha-muted);
    font-weight: 500;
  }

  /* Pills */
  .ha-pills {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    margin-top: 8px;
    overflow: hidden;
    align-items: center;
  }

  .ha-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    border: 1.5px solid var(--ha-text);
    background: #fff;
    white-space: nowrap;
    flex-shrink: 0;
    color: var(--ha-text);
    line-height: 1.4;
  }

  .ha-pill-icon svg { color: var(--ha-icon); flex-shrink: 0; }
  .ha-pill-price    { font-weight: 700; }

  /* ── Skeleton ─────────────────────────────────────────── */

  .ha-sk {
    flex: 0 0 calc(20% - 12px);
    border-radius: var(--ha-radius);
    overflow: hidden;
    background: var(--ha-card-bg);
    box-shadow: var(--ha-card-shadow);
  }

  .ha-sk-img {
    width: 100%;
    height: var(--ha-img-h);
    background: linear-gradient(90deg, #e9e0ff 25%, #d8caff 50%, #e9e0ff 75%);
    background-size: 200% 100%;
    animation: ha-shimmer 1.5s ease-in-out infinite;
  }

  .ha-sk-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  .ha-sk-line {
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, #e9e0ff 25%, #d8caff 50%, #e9e0ff 75%);
    background-size: 200% 100%;
    animation: ha-shimmer 1.5s ease-in-out infinite;
  }

  @keyframes ha-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .ha-empty {
    padding: 40px 0;
    text-align: center;
    color: var(--ha-muted);
    font-size: 13px;
    width: 100%;
  }

  /* ── Tablet: 3 cards ──────────────────────────────────── */
  @media (min-width: 541px) and (max-width: 860px) {
    .ha-card, .ha-sk { flex: 0 0 calc(33.333% - 10px); }
  }

  /* ── Mobile ───────────────────────────────────────────── */
  @media (max-width: 540px) {
    :root { --ha-img-h: 160px; }

    .ha-carousel-wrap { margin: 0 16px; }
    .ha-nav-prev { left: -20px; }
    .ha-nav-next { right: -20px; }

    .ha-cards {
      padding-left: 6vw;
      padding-right: 6vw;
      scroll-padding-inline: 6vw;
    }

    .ha-card, .ha-sk {
      flex: 0 0 85vw;
      scroll-snap-align: center;
    }
  }
</style>
</head>
<body>
<div id="ha-widget">

  <div class="ha-headline">
    <span class="ha-hl1">IN THE LAST 24 HOURS,<br>HOUSALERT FOUND</span>
    <span class="ha-hl2">
      <span class="ha-num" id="ha-count">—</span> RENTAL PROPERTIES IN
      <span class="ha-city-wrap">
        <span id="ha-city-mirror" aria-hidden="true" style="position:absolute;visibility:hidden;white-space:pre;pointer-events:none;"></span>
        <select id="ha-city-select" aria-label="Select city">
          <option value="Dublin">Dublin</option>
          <option value="Cork">Cork</option>
          <option value="Galway">Galway</option>
          <option value="Limerick">Limerick</option>
          <option value="Waterford">Waterford</option>
          <option value="Drogheda">Drogheda</option>
          <option value="Dundalk">Dundalk</option>
          <option value="Swords">Swords</option>
          <option value="Bray">Bray</option>
          <option value="Kilkenny">Kilkenny</option>
        </select>
      </span>
    </span>
  </div>

  <div class="ha-carousel-wrap">
    <button class="ha-nav-btn ha-nav-prev" id="ha-prev" aria-label="Previous">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="ha-cards" id="ha-cards"></div>
    <button class="ha-nav-btn ha-nav-next" id="ha-next" aria-label="Next">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="ha-dots" id="ha-dots"></div>

</div>

<script>
(function () {
  var widgetEl   = document.getElementById("ha-widget");
  var API_BASE   = (widgetEl && widgetEl.getAttribute("data-api"))
    || (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? window.location.origin : "https://app.housalert.com");

  var citySelect  = document.getElementById("ha-city-select");
  var cityMirror  = document.getElementById("ha-city-mirror");
  var cardsEl     = document.getElementById("ha-cards");
  var countEl     = document.getElementById("ha-count");
  var dotsEl      = document.getElementById("ha-dots");
  var prevBtn     = document.getElementById("ha-prev");
  var nextBtn     = document.getElementById("ha-next");

  /* Size the city <select> to match the current option's text width */
  function resizeCitySelect() {
    var text = citySelect.options[citySelect.selectedIndex]
      ? citySelect.options[citySelect.selectedIndex].text : "Dublin";
    var cs = window.getComputedStyle(citySelect);
    cityMirror.style.fontFamily    = cs.fontFamily;
    cityMirror.style.fontSize      = cs.fontSize;
    cityMirror.style.fontWeight    = cs.fontWeight;
    cityMirror.style.letterSpacing = cs.letterSpacing;
    cityMirror.style.textTransform = cs.textTransform;
    cityMirror.textContent = text.toUpperCase();
    citySelect.style.width = (cityMirror.offsetWidth + 36) + "px";
  }
  /* Run after fonts likely loaded */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(resizeCitySelect);
  } else {
    setTimeout(resizeCitySelect, 300);
  }
  window.addEventListener("resize", resizeCitySelect);

  var BED_ICON  = '<span class="ha-pill-icon"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg></span>';
  var SIZE_ICON = '<span class="ha-pill-icon"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></span>';
  var HOUSE_SVG = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9f7aea" stroke-width="1.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';

  var totalCards = 0;
  var cardW = 0;

  /* Strip display title to street name only (before first comma) */
  function shortTitle(displayTitle, city) {
    if (!displayTitle || displayTitle === city) return city || "Rental Property";
    var first = displayTitle.split(",")[0].trim();
    return first.length > 2 ? first : displayTitle;
  }

  function getVisible() {
    return window.innerWidth <= 540 ? 1 : window.innerWidth <= 860 ? 3 : 5;
  }

  function scrollStep() { return cardW + 14; }

  function updateNav() {
    var sl = cardsEl.scrollLeft;
    var maxSl = cardsEl.scrollWidth - cardsEl.clientWidth;
    prevBtn.disabled = sl <= 2;
    nextBtn.disabled = sl >= maxSl - 2;
  }

  function buildDots() {
    var visible = getVisible();
    if (totalCards <= visible) { dotsEl.innerHTML = ""; return; }
    var steps = totalCards - visible + 1;
    var sl = cardsEl.scrollLeft;
    var step = scrollStep() || 1;
    var active = Math.min(Math.round(sl / step), steps - 1);
    var html = "";
    for (var i = 0; i < steps; i++) {
      html += "<button class='ha-dot" + (i === active ? " active" : "") + "' data-i='" + i + "'></button>";
    }
    dotsEl.innerHTML = html;
    dotsEl.querySelectorAll(".ha-dot").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(this.getAttribute("data-i"), 10);
        cardsEl.scrollTo({ left: idx * scrollStep(), behavior: "smooth" });
      });
    });
  }

  function onScroll() { updateNav(); buildDots(); }

  cardsEl.addEventListener("scroll", onScroll, { passive: true });
  prevBtn.addEventListener("click", function () { cardsEl.scrollBy({ left: -scrollStep(), behavior: "smooth" }); });
  nextBtn.addEventListener("click", function () { cardsEl.scrollBy({ left:  scrollStep(), behavior: "smooth" }); });
  window.addEventListener("resize", function () {
    var c = cardsEl.querySelector(".ha-card");
    cardW = c ? c.offsetWidth : cardW;
    buildDots(); updateNav();
  });

  function timeAgo(iso) {
    var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60)    return "just now";
    if (diff < 3600)  return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function skeletons(n) {
    var s = "";
    for (var i = 0; i < n; i++) {
      s += '<div class="ha-sk"><div class="ha-sk-img"></div>'
        + '<div class="ha-sk-body">'
        + '<div class="ha-sk-line" style="width:62%"></div>'
        + '<div class="ha-sk-line" style="width:36%"></div>'
        + '<div class="ha-sk-line" style="width:78%"></div>'
        + '</div></div>';
    }
    return s;
  }

  function renderCards(listings) {
    if (!listings || !listings.length) {
      dotsEl.innerHTML = "";
      return '<div class="ha-empty">No listings found for this city yet — check back soon!</div>';
    }
    var items = listings.slice(0, 8);
    totalCards = items.length;

    return items.map(function (l) {
      var title    = shortTitle(l.displayTitle, l.city);
      var imgStyle = l.imageUrl ? "background-image:url(" + l.imageUrl + ")" : "";

      var pills = "";
      if (l.bedrooms && l.bedrooms > 0) {
        pills += "<span class='ha-pill'>" + BED_ICON + esc(l.bedrooms) + "</span>";
      }
      if (l.size_m2 && l.size_m2 > 0) {
        pills += "<span class='ha-pill'>" + SIZE_ICON + esc(l.size_m2) + " m\u00b2</span>";
      }
      if (l.price && l.price > 0) {
        pills += "<span class='ha-pill ha-pill-price'>\u20ac" + Number(l.price).toLocaleString("en-IE") + "</span>";
      }

      return "<div class='ha-card'>"
        + "<div class='ha-img-wrap'>"
        + (imgStyle ? "<div class='ha-img-bg' style='" + imgStyle + "'></div>" : "")
        + "<div class='ha-img-placeholder'>" + HOUSE_SVG + "</div>"
        + "</div>"
        + "<div class='ha-card-body'>"
        + "<div class='ha-card-title'>" + esc(title) + "</div>"
        + "<div class='ha-card-meta'>" + esc(timeAgo(l.foundAt)) + "</div>"
        + (pills ? "<div class='ha-pills'>" + pills + "</div>" : "")
        + "</div></div>";
    }).join("");
  }

  function load(city) {
    cardsEl.innerHTML = skeletons(5);
    dotsEl.innerHTML = "";
    prevBtn.disabled = true;
    nextBtn.disabled = false;
    countEl.textContent = "\u2014";

    fetch(API_BASE + "/api/public/latest-listings?city=" + encodeURIComponent(city) + "&limit=8")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        countEl.textContent = data.countLast24h != null ? data.countLast24h : "?";
        cardsEl.innerHTML = renderCards(data.listings);
        cardsEl.scrollLeft = 0;
        requestAnimationFrame(function () {
          var c = cardsEl.querySelector(".ha-card");
          cardW = c ? c.offsetWidth : 200;
          buildDots();
          updateNav();
        });
      })
      .catch(function () {
        countEl.textContent = "?";
        cardsEl.innerHTML = '<div class="ha-empty">Unable to load listings right now.</div>';
        dotsEl.innerHTML = "";
      });
  }

  citySelect.addEventListener("change", function () { load(this.value); });

  load("Dublin");
})();
</script>
</body>
</html>
